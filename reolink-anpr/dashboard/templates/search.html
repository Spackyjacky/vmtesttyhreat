<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reolink ANPR — Search</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #111; color: #eee; }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  form.filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  form.filters input, form.filters select { padding: 0.4rem; border-radius: 4px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
  form.filters button { padding: 0.4rem 1rem; border-radius: 4px; border: none; background: #3a6df0; color: #fff; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  .card { background: #1c1c1c; border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; background: #000; }
  .card .meta { padding: 0.5rem 0.6rem; font-size: 0.85rem; }
  .card .plate { font-weight: bold; font-size: 1.05rem; }
  .card .sub { color: #999; }
  .empty { color: #999; padding: 2rem 0; text-align: center; }
</style>
</head>
<body>
  <h1>Reolink ANPR — Vehicle Search</h1>

  <form class="filters" method="get" action="/">
    <input type="text" name="plate" placeholder="Plate contains..." value="{{ filters.plate }}">
    <select name="color">
      <option value="">Any colour</option>
      {% for c in colors %}
      <option value="{{ c }}" {% if filters.color == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <select name="camera">
      <option value="">Any camera</option>
      {% for cam in cameras %}
      <option value="{{ cam }}" {% if filters.camera == cam %}selected{% endif %}>{{ cam }}</option>
      {% endfor %}
    </select>
    <input type="datetime-local" name="start" value="{{ filters.start }}">
    <input type="datetime-local" name="end" value="{{ filters.end }}">
    <button type="submit">Search</button>
  </form>

  {% if events %}
  <div class="grid">
    {% for e in events %}
    <a class="card" href="/event/{{ e.id }}">
      <img src="/captures/{{ e.vehicle_image_path }}" loading="lazy" alt="vehicle">
      <div class="meta">
        <div class="plate">{{ e.plate or "—" }}</div>
        <div class="sub">{{ e.camera }} · {{ e.vehicle_type or "vehicle" }} · {{ e.color or "?" }}</div>
        <div class="sub">{{ e.timestamp }}</div>
      </div>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty">No captures match this search yet.</div>
  {% endif %}
</body>
</html>
